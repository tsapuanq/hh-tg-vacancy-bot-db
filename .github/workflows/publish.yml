name: Vacancy Scraping and Publishing Pipeline

on:
  schedule:
    - cron: '0 7 * * 1-6'
    - cron: '0 11 * * 1-6'
    - cron: '0 15 * * 1-6'

  workflow_dispatch:

jobs:
  run_full_pipeline:
    name: Run Main Pipeline
    runs-on: ubuntu-latest 

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      CHANNEL_USERNAME: ${{ secrets.CHANNEL_USERNAME }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SOURCE_CHANNEL: ${{ secrets.TELEGRAM_SOURCE_CHANNEL }}
      TELEGRAM_SESSION_STRING: ${{ secrets.TELEGRAM_SESSION_STRING }}
      OPENAI_VISION_MODEL: ${{ vars.OPENAI_VISION_MODEL || 'gpt-4.1-mini' }}
      TELEGRAM_LOOKBACK_DAYS: ${{ vars.TELEGRAM_LOOKBACK_DAYS || '2' }}
      TELEGRAM_SOURCE_LIMIT: ${{ vars.TELEGRAM_SOURCE_LIMIT || '50' }}
      TELEGRAM_PROCESS_LIMIT: ${{ vars.TELEGRAM_PROCESS_LIMIT || '20' }}
      TELEGRAM_PHOTO_OCR_ENABLED: ${{ vars.TELEGRAM_PHOTO_OCR_ENABLED || 'true' }}
      TELEGRAM_PHOTO_OCR_WITH_CAPTION: ${{ vars.TELEGRAM_PHOTO_OCR_WITH_CAPTION || 'true' }}
      TELEGRAM_PHOTO_OCR_LIMIT_PER_RUN: ${{ vars.TELEGRAM_PHOTO_OCR_LIMIT_PER_RUN || '20' }}
      TELEGRAM_PHOTO_OCR_DETAIL: ${{ vars.TELEGRAM_PHOTO_OCR_DETAIL || 'low' }}


    steps:
      - name: Checkout code
        uses: actions/checkout@v4 

      - name: Set up Python
        id: setup-python 
        uses: actions/setup-python@v5 
        with:
          python-version: '3.10' 

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip 
          key: ${{ runner.os }}-python-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-python-${{ steps.setup-python.outputs.python-version }}-
            ${{ runner.os }}-python-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install telethon==1.43.2

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright 
          key: ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-${{ hashFiles('requirements.txt') }}
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: playwright install --with-deps

      - name: Run the main pipeline script
        run: |
          python run_all.py

      - name: Run Telegram source pipeline
        run: |
          python run_telegram.py
